<!DOCTYPE html>
<html class="h-full bg-surface-container-lowest light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Login - CampusConnect</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link href="assets/css/styles.css" rel="stylesheet"/>
</head>
<body class="h-full bg-surface-container-lowest text-on-surface flex items-center justify-center font-body-md antialiased selection:bg-primary-container selection:text-on-primary min-h-screen">
  
  <div class="w-full max-w-md p-lg md:p-2xl bg-surface-container-lowest md:border md:border-outline-variant md:rounded-xl shadow-none md:shadow-[0px_4px_12px_rgba(0,0,0,0.05)]">
    <div class="mb-xl text-center">
      <a href="index.html" class="font-headline-lg text-headline-lg md:font-display md:text-display text-primary mb-sm block">CampusConnect</a>
      <p class="font-headline-md text-headline-md text-on-surface">Welcome Back</p>
    </div>
    
    <form action="dashboard.html" class="space-y-lg" method="GET">
      <div>
        <label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="email">Institutional Email</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
            <span class="material-symbols-outlined text-outline">mail</span>
          </div>
          <input class="block w-full pl-[36px] pr-sm py-[10px] border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container font-body-md text-body-md transition-shadow" id="email" name="email" placeholder="student@university.edu" required type="email"/>
        </div>
      </div>
      
      <div>
        <div class="flex items-center justify-between mb-xs">
          <label class="block font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
          <a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-dim transition-colors" href="reset-password.html">Forgot Password?</a>
        </div>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
            <span class="material-symbols-outlined text-outline">lock</span>
          </div>
          <input class="block w-full pl-[36px] pr-sm py-[10px] border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container font-body-md text-body-md transition-shadow" id="password" name="password" placeholder="••••••••" required type="password"/>
        </div>
      </div>

      <button class="w-full flex justify-center py-[10px] px-lg border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-colors" type="submit">
        Log In
      </button>
    </form>

    <p class="mt-xl text-center font-body-sm text-body-sm text-on-surface-variant">
      Don't have an account? <a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors" href="signup.html">Sign Up</a>
    </p>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
